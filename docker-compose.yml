services:
  postgres:
    image: postgres:16-alpine
    container_name: exlsmartassist-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exlsmartassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exlsmartassist}
      POSTGRES_DB: ${POSTGRES_DB:-exlsmartassist}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exlsmartassist}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: exlsmartassist-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-exlsmartassist}:${POSTGRES_PASSWORD:-exlsmartassist}@postgres:5432/${POSTGRES_DB:-exlsmartassist}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/app/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: exlsmartassist-frontend
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  chroma_data:
